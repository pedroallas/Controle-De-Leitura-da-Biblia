<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Leitura da Bíblia</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        @media (max-width: 600px) {
            /* Estilos para dispositivos móveis */
            body {
                font-size: 14px;
            }
            table {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <h1>Controle de Leitura da Bíblia</h1>
    <p style="font-style: italic; font-size: 20px;">feito por Pedro Allas dos Santos Borges</p>

    <table>
        <thead>
            <tr>
                <th style="background-color: #002060; color: #fff;">Livro</th>
                <th style="background-color: #002060; color: #fff;">Capítulos</th>
                <th style="background-color: #002060; color: #fff;">Versículos</th>
                <th style="background-color: #002060; color: #fff;">Lido</th>
            </tr>
        </thead>
        <tbody id="tabela-livros">
            <!-- Livros da Bíblia serão adicionados aqui -->
        </tbody>
    </table>
    <p>Percentual Lido: <span id="percentual-lido">0%</span></p>
    <p>Capítulos Lidos: <span id="capitulos-lidos">0</span></p>
    <p>Versículos Lidos: <span id="versiculos-lidos">0</span></p>
    
    <!-- Botões de salvar e carregar progresso -->
    <button id="save-button">Salvar Progresso</button>
    <button id="load-button">Carregar Progresso</button>

    <script type="module" src="main.js"></script>
</body>
</html>
